name: frame
description: A modern PSD previewer, font manager, and asset utility for graphic designers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  archive: ^3.4.10
  image: ^4.1.7
  connectivity_plus: ^6.0.1
  http: ^1.2.1
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
